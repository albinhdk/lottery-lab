# Dart 静态检查配置。规则集来自 flutter_lints，可在下面的 rules 中增删。
# 说明：analyzer 的 exclude 列表排除了各平台原生目录（由各平台工具链自己检查）。
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  # 启用的规则在 flutter_lints 之上做增量；禁用单行用 // ignore: <rule>。
  rules:
    # 需要临时关闭某条规则时写在这里，并注明原因。
