name: lottery_lab_app
description: "彩票实验室：彩票统计分析与回测工具。"
# 本项目不是 pub 包，不发布到 pub.dev。
publish_to: 'none'

# 版本号 = 三段式 version + build number。
# Android versionName / versionCode、Windows 文件版本均由它驱动；
# 请与 backend/Cargo.toml 的 version 保持一致。
version: 1.1.0+2

environment:
  sdk: ^3.13.0

# 依赖版本：升级前先跑 `flutter pub outdated`。
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  fl_chart: ^1.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 静态检查规则集，配置见 frontend/analysis_options.yaml
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/lottery.db
    - assets/lottery_seed.json

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
