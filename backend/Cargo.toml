[package]
name = "lottery_lab_backend"
version = "1.1.1"
edition = "2024"
description = "彩票实验室后端：彩票历史数据同步、统计分析与严格走查回测"
license = "MIT"
repository = "https://github.com/albinhdk/lottery-lab"
readme = "../README.md"

[lib]
name = "lottery_lab_backend"
crate-type = ["rlib", "cdylib"]

[profile.release]
strip = true
lto = "thin"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "system-proxy", "charset"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.0"
